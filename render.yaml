# https://render.com/docs/blueprint-spec
# Do not use `corepack enable` on Render (read-only /usr/bin).
services:
  - type: web
    name: prait-landing-page
    runtime: static
    buildCommand: PORT=4173 BASE_PATH=/ pnpm --filter @workspace/prait-landing run build
    staticPublishPath: artifacts/prait-landing/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
